[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "midev-tools"
version = "1.0.0"
description = "Standalone code-generated game art asset pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pillow>=11,<13",
    "resvg-py>=0.2,<1",
]

[project.scripts]
midev = "midev:main"

[tool.setuptools]
py-modules = ["midev"]
packages = []

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]


