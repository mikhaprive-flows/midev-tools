[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "midev-tools"
version = "1.0.0"
description = "Standalone code-generated game art asset pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pillow>=11",
    "numpy>=2",
    "resvg-py>=0.2",
]

[project.scripts]
midev = "midev:main"
