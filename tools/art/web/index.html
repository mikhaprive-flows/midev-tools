<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>midev Studio - Game Art Asset Dashboard</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="stylesheet" href="/studio.css">
</head>
<body>
  <!-- Header -->
  <header>
    <div class="logo-area">
      <span class="logo-tag">⚡ midev Studio</span>
      <div class="project-selector-wrapper">
        <label for="projectSelect" class="project-label">Project:</label>
        <select id="projectSelect" class="project-select" title="Switch active game project">
          <!-- Populated dynamically -->
        </select>
      </div>
      <span class="badge" id="headerPalette">Palette: fisharium32</span>
    </div>
    <div class="header-right">
      <div class="support-links">
        <a href="https://ko-fi.com/midevfish" target="_blank" rel="noopener noreferrer" class="support-btn" title="Support Developer on Ko-fi">
          ☕ Ko-fi
        </a>
        <a href="https://trakteer.id/MiDevFish" target="_blank" rel="noopener noreferrer" class="support-btn trakteer-btn" title="Support Developer on Trakteer">
          🍨 Trakteer
        </a>
      </div>
      <div class="live-indicator">
        <div class="dot"></div>
        <span>Hot-Reload Active</span>
      </div>
    </div>
  </header>

  <!-- Studio Layout -->
  <div class="studio-layout">
    <!-- Left Sidebar: Asset & Recipe Navigation -->
    <aside class="sidebar">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search assets (e.g. player, chest, terrain)...">
      </div>
      <div class="category-tabs" id="categoryTabs">
        <button class="cat-pill active" data-cat="all">All</button>
        <button class="cat-pill" data-cat="sprites">Sprites</button>
        <button class="cat-pill" data-cat="tiles">Tiles</button>
        <button class="cat-pill" data-cat="ui">UI</button>
        <button class="cat-pill" data-cat="backgrounds">BGs</button>
      </div>
      <ul class="recipe-list" id="recipeList">
        <!-- Rendered dynamically -->
      </ul>
    </aside>

    <!-- Center: Interactive Viewport -->
    <main class="viewport-area">
      <!-- Controls Bar -->
      <div class="controls-bar">
        <div class="playback-controls">
          <select id="animSelect" class="select" title="Select Animation">
            <!-- Animations list -->
          </select>
          <button id="playBtn" class="btn btn-primary">❚❚ Pause</button>
          <button id="prevFrameBtn" class="btn" title="Previous Frame">⏮</button>
          <button id="nextFrameBtn" class="btn" title="Next Frame">⏭</button>
          <div class="fps-container">
            <span>Speed:</span>
            <input type="range" id="fpsSlider" min="1" max="60" value="10">
            <span id="fpsVal">10 fps</span>
          </div>
        </div>

        <div class="view-controls">
          <select id="zoomSelect" class="select">
            <option value="1">1x Scale</option>
            <option value="2">2x Scale</option>
            <option value="4" selected>4x Scale</option>
            <option value="6">6x Scale</option>
            <option value="8">8x Scale</option>
          </select>
          <button id="toggleOrigin" class="btn btn-primary" title="Toggle Origin Crosshair">Origin</button>
          <button id="toggleGrid" class="btn" title="Toggle Pixel Grid">Grid</button>
          <button id="rebuildBtn" class="btn" title="Trigger Rebuild">⚡ Rebuild</button>
        </div>
      </div>

      <!-- Canvas Viewport -->
      <div class="canvas-wrapper">
        <canvas id="viewportCanvas"></canvas>
      </div>

      <!-- Bottom Frame Strip -->
      <div class="frame-strip-bar" id="frameStrip">
        <!-- Frame thumbnails rendered dynamically -->
      </div>
    </main>

    <!-- Right Inspector Panel -->
    <aside class="inspector">
      <div class="inspector-section">
        <h3 id="inspRecipeName">Asset Inspector</h3>
        <div class="prop-row">
          <span class="prop-label">Category</span>
          <span class="prop-val" id="inspCategory">-</span>
        </div>
        <div class="prop-row">
          <span class="prop-label">Source Recipe</span>
          <span class="prop-val" id="inspSourceRecipe">-</span>
        </div>
        <div class="prop-row">
          <span class="prop-label">Frame Size</span>
          <span class="prop-val" id="inspFrameSize">-</span>
        </div>
        <div class="prop-row">
          <span class="prop-label">Origin (X, Y)</span>
          <span class="prop-val" id="inspOrigin">-</span>
        </div>
        <div class="prop-row">
          <span class="prop-label">Sheet Size</span>
          <span class="prop-val" id="inspSheetSize">-</span>
        </div>
      </div>

      <div class="inspector-section">
        <h3>Current Animation</h3>
        <div class="prop-row">
          <span class="prop-label">Frames</span>
          <span class="prop-val" id="inspAnimFrames">-</span>
        </div>
        <div class="prop-row">
          <span class="prop-label">Base FPS</span>
          <span class="prop-val" id="inspAnimFps">-</span>
        </div>
        <div class="prop-row">
          <span class="prop-label">Loops</span>
          <span class="prop-val" id="inspAnimLoop">-</span>
        </div>
      </div>

      <div class="inspector-section">
        <h3>Engine Exports</h3>
        <div class="export-links" id="exportLinks">
          <!-- Rendered dynamically -->
        </div>
      </div>
    </aside>
  </div>

  <script src="/studio.js"></script>
</body>
</html>
