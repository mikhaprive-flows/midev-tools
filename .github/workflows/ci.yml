name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint & Style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Linting
        run: ruff check .

  test:
    name: Test (${{ matrix.os }} - Py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    env:
      CI: "true"
      MIDEV_NO_VENV_BOOTSTRAP: "1"
      PYTHONIOENCODING: "utf-8"
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run Diagnostics (Doctor)
        run: |
          midev doctor --json

      - name: Run Automated Test Suite
        run: |
          midev test

      - name: Build Samples (Fisharium)
        run: |
          midev project use samples/fisharium
          midev build --json

      - name: Build Projects (Demo RPG)
        run: |
          midev project use projects/demo_rpg
          midev build --json

      - name: Verify Git Status Cleanliness
        shell: bash
        run: |
          # Ensure build artifacts and tests did not mutate tracked workspace files
          git diff --exit-code
